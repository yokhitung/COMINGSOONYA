<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Mundur Ulang Tahun Ronel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b, #3b82f6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 650px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #f8fafc;
        }

        p.target-date {
            font-size: 1.1rem;
            color: #93c5fd;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.12);
            padding: 18px 12px;
            border-radius: 16px;
            min-width: 100px;
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .number {
            font-size: 2.6rem;
            font-weight: 700;
            display: block;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
            display: block;
            color: #cbd5e1;
        }

        #message {
            margin-top: 30px;
            font-size: 2rem;
            font-weight: 700;
            color: #fde047;
            display: none;
            animation: pop 0.5s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 500px) {
            .number {
                font-size: 1.8rem;
            }
            .time-box {
                min-width: 70px;
                padding: 12px 6px;
            }
            .label {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ulang Tahun Ronel</h1>
        <p class="target-date">14 Desember 2026 • 00:00 WIB</p>

        <div class="countdown-container" id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Hari</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Jam</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Menit</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Detik</span>
            </div>
        </div>

        <div id="message">🎉 Selamat Ulang Tahun, Ronel! 🎂✨</div>
    </div>

    <script>
        // Tanggal target: 14 Desember 2026 jam 00:00:00
        const birthdayDate = new Date("2026-12-14T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = birthdayDate - now;

            if (distance <= 0) {
                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";
                clearInterval(timer);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        const timer = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
